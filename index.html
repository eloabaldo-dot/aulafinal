<!doctype html>
<html lang="pt-BR" dir="ltr">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=5.0" />
    <meta http-equiv="X-UA-Compatible" content="IE=edge" />

    <!-- Título Primário SEO -->
    <title>SmartTrip AI - Assistente Inteligente de Planejamento de Viagens</title>

    <!-- Meta Tags Essenciais de SEO e Indexação -->
    <meta
      name="description"
      content="Planeje viagens inesquecíveis com inteligência artificial. Roteiros diários personalizados com base em suas folgas, clima local em tempo real, orçamento e atrações autênticas."
    />
    <meta
      name="keywords"
      content="roteiro de viagem, inteligência artificial, turismo, planejamento de férias, itinerário personalizado, previsão do tempo, pontos de interesse, SmartTrip"
    />
    <meta name="author" content="Equipe SmartTrip" />
    <meta name="robots" content="index, follow" />
    <meta name="theme-color" content="#0d9488" />
    <meta name="color-scheme" content="light dark" />

    <!-- Open Graph / Redes Sociais (Facebook, WhatsApp, LinkedIn) -->
    <meta property="og:type" content="website" />
    <meta property="og:locale" content="pt_BR" />
    <meta property="og:site_name" content="SmartTrip AI" />
    <meta property="og:title" content="SmartTrip AI - Assistente Inteligente de Planejamento de Viagens" />
    <meta
      property="og:description"
      content="Crie roteiros de viagem sob medida em segundos. Integração de inteligência artificial generativa com dados meteorológicos e geográficos reais."
    />
    <meta property="og:image" content="/favicon.svg" />

    <!-- Twitter Cards -->
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="SmartTrip AI - Assistente Inteligente de Planejamento de Viagens" />
    <meta
      name="twitter:description"
      content="Crie roteiros de viagem sob medida em segundos com IA generativa, dados meteorológicos e atrações reais."
    />
    <meta name="twitter:image" content="/favicon.svg" />

    <!-- Favicon & Identidade Visual -->
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="apple-touch-icon" href="/favicon.svg" />

    <!-- Otimização de Carregamento de Fontes Tipográficas -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;500;600;700;800&family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap"
      rel="stylesheet"
    />
    <link
      href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@20..48,100..700,0..1,-50..200"
      rel="stylesheet"
    />
  </head>
  <body class="bg-slate-50 dark:bg-slate-950 text-slate-900 dark:text-slate-100 font-sans antialiased selection:bg-teal-600 selection:text-white transition-colors duration-200">
    <!-- Fallback Acessível para Ambientes com JavaScript Desabilitado -->
    <noscript>
      <div style="padding: 2rem; text-align: center; font-family: sans-serif; background-color: #fef2f2; color: #991b1b;">
        <h2>JavaScript Necessário</h2>
        <p>O SmartTrip AI necessita do JavaScript habilitado no navegador para orquestrar roteiros inteligentes e interações em tempo real.</p>
      </div>
    </noscript>

    <!-- Contêiner Raiz do React -->
    <div id="root"></div>

    <!-- Ponto de Entrada da Aplicação -->
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
